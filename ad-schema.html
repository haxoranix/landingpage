let current = 0;

const title = document.getElementById('pageTitle');
const count = document.getElementById('count');
const code = document.getElementById('schemaCode');
const url = document.getElementById('pageUrl');
const prev = document.getElementById('prevBtn');
const next = document.getElementById('nextBtn');
const copy = document.getElementById('copyBtn');

function render() {
  const page = pages[current];
  title.textContent = page.title;
  count.textContent = `${current + 1} / ${pages.length}`;
  url.textContent = page.url;
  url.href = page.url;
  code.textContent = page.script;
  prev.disabled = current === 0;
  next.disabled = current === pages.length - 1;
  copy.textContent = 'Copy full script';
  window.scrollTo({top: 0, behavior: 'instant'});
}

async function copyScript() {
  const value = pages[current].script;
  try {
    await navigator.clipboard.writeText(value);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = value;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  copy.textContent = 'Copied!';
  setTimeout(() => copy.textContent = 'Copy full script', 1200);
}

prev.addEventListener('click', () => {
  if (current > 0) {
    current--;
    render();
  }
});

next.addEventListener('click', () => {
  if (current < pages.length - 1) {
    current++;
    render();
  }
});

copy.addEventListener('click', copyScript);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && current > 0) {
    current--;
    render();
  }
  if (e.key === 'ArrowRight' && current < pages.length - 1) {
    current++;
    render();
  }
});

render();
</script>

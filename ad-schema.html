<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adatasol Schema Copy Center</title>
  <style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e4e8f0;--accent:#3157d5;--accent2:#eef2ff;--code:#101827;--sidebar:290px}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}.brand{height:74px;padding:15px 18px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--line)}.brand-mark{display:grid;place-items:center;width:39px;height:39px;border-radius:11px;background:var(--accent);color:#fff;font-weight:800}.brand strong,.brand small{display:block}.brand small{color:var(--muted);margin-top:2px}.search-wrap{padding:15px 14px 8px}.search-wrap input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none}.search-wrap input:focus{border-color:#9badf2;box-shadow:0 0 0 3px #edf0ff}.count{padding:5px 17px 10px;color:var(--muted);font-size:12px}.nav{padding:0 9px 18px;overflow:auto}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:9px;color:#3f485a;cursor:pointer;display:flex;gap:9px;line-height:1.3}.nav button:hover{background:#f4f6fa}.nav button.active{background:var(--accent2);color:#2548bf;font-weight:700}.nav .num{min-width:25px;color:#929bad;font-size:12px;padding-top:2px}.nav button.active .num{color:#5c74ca}.main{margin-left:var(--sidebar);min-height:100vh}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;gap:15px;position:sticky;top:0;z-index:10}.crumb{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb span{margin:0 7px;color:#a5adbb}.crumb b{color:var(--ink)}.github{margin-left:auto;text-decoration:none;color:var(--accent);font-size:14px}.content{padding:34px;max-width:1280px;margin:auto}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--accent);font-weight:800}.hero h1{font-size:30px;margin:6px 0 7px;line-height:1.15}.hero a{color:var(--muted);font-size:14px;word-break:break-all}.primary{border:0;border-radius:9px;background:var(--accent);color:#fff;padding:11px 15px;font-weight:700;cursor:pointer;white-space:nowrap}.meta-grid{display:grid;grid-template-columns:2fr .7fr 1fr;gap:12px;margin-bottom:18px}.meta-grid article{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 64px 15px 16px;min-height:83px}.meta-grid span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}.meta-grid strong{font-size:14px;line-height:1.4}.mini-copy{position:absolute;right:10px;top:28px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 8px;font-size:11px;cursor:pointer}.code-card{background:var(--code);border-radius:13px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.08)}.code-head{min-height:55px;background:#182235;border-bottom:1px solid #283448;color:#d8deea;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;gap:12px}.code-head b{font-size:13px;margin-left:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.red{background:#ff6b6b}.yellow{background:#f6c453}.green{background:#57cc99}.actions{display:flex;gap:8px}.actions button{background:#25324a;color:#e8edf6;border:1px solid #35435d;border-radius:7px;padding:7px 9px;font-size:12px;cursor:pointer}pre{margin:0;padding:22px;max-height:65vh;overflow:auto;color:#d8e2f2;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}code{white-space:pre}.pager{display:flex;justify-content:space-between;align-items:center;margin:20px 0 35px;gap:12px}.pager button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}.pager span{font-size:13px;color:var(--muted)}.state{min-height:60vh;display:grid;place-content:center;text-align:center;color:var(--muted)}.state h2{color:var(--ink);margin-bottom:5px}.spinner{width:34px;height:34px;border:3px solid #e4e8f0;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:#fff;padding:10px 14px;border-radius:9px;transform:translateY(80px);opacity:0;transition:.2s;z-index:50}.toast.show{transform:none;opacity:1}.mobile-only{display:none}.overlay{display:none}@media(max-width:850px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0}.mobile-only{display:block}.icon-btn{border:0;background:transparent;font-size:21px;cursor:pointer}.overlay.show{display:block;position:fixed;inset:0;background:#0007;z-index:15}.content{padding:22px 16px}.topbar{padding:0 16px}.hero{display:block}.hero .primary{margin-top:18px}.meta-grid{grid-template-columns:1fr}.code-head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.pager span{display:none}}

</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">A</span><div><strong>Adatasol</strong><small>Schema Copy Center</small></div></div>
      <div class="search-wrap"><input id="search" type="search" placeholder="Search pages…" autocomplete="off"></div>
      <div class="count" id="count">Loading schemas…</div>
      <nav id="nav" class="nav" aria-label="Schema pages"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only" aria-label="Open navigation">☰</button>
        <div class="crumb">Schema Library <span>›</span> <b id="crumbTitle">Loading…</b></div>
        <a class="github" href="https://github.com/haxoranix/landingpage/blob/main/adatasol-all-service-schemas-master.txt" target="_blank" rel="noopener">Source ↗</a>
      </header>

      <section id="loading" class="state"><div class="spinner"></div><h2>Loading schema library</h2><p>Reading the master file from GitHub…</p></section>
      <section id="error" class="state hidden"><h2>Couldn’t load the master file</h2><p id="errorText"></p><button id="retryBtn" class="primary">Retry</button></section>

      <section id="content" class="content hidden">
        <div class="hero">
          <div><div class="eyebrow" id="pageNumber"></div><h1 id="title"></h1><a id="pageUrl" target="_blank" rel="noopener"></a></div>
          <button id="copyScriptTop" class="primary">Copy full script</button>
        </div>

        <div class="meta-grid">
          <article><span>Elementor Custom Code</span><strong id="codeName"></strong><button class="mini-copy" data-copy-target="codeName">Copy</button></article>
          <article><span>Location</span><strong id="location"></strong><button class="mini-copy" data-copy-target="location">Copy</button></article>
          <article><span>Display Condition</span><strong id="condition"></strong><button class="mini-copy" data-copy-target="condition">Copy</button></article>
        </div>

        <article class="code-card">
          <div class="code-head"><div><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><b>JSON-LD Schema Script</b></div><div class="actions"><button id="copyJson">Copy JSON only</button><button id="copyScript">Copy full script</button></div></div>
          <pre><code id="schemaCode"></code></pre>
        </article>

        <div class="pager"><button id="prevBtn">← Previous page</button><span id="pagerLabel"></span><button id="nextBtn">Next page →</button></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast">Copied</div>
  <div id="overlay" class="overlay"></div>
  <script>
const RAW_URL='https://raw.githubusercontent.com/haxoranix/landingpage/main/adatasol-all-service-schemas-master.txt';
const $=s=>document.querySelector(s); let pages=[],filtered=[],current=0;

function parseMaster(text){
  const re=/^={20,}\s*\n(\d+)\.\s+(.+?)\s*\nPage:\s*(.+?)\s*\nElementor Custom Code Name:\s*(.+?)\s*\nLocation:\s*(.+?)\s*\nDisplay Condition:\s*(.+?)\s*\n={20,}\s*\n([\s\S]*?)(?=\n={20,}\s*\n\d+\.\s|$)/gm;
  const out=[]; let m;
  while((m=re.exec(text))!==null){
    const script=m[7].trim();
    const jsonMatch=script.match(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/i);
    out.push({number:m[1],title:m[2].trim(),url:m[3].trim(),codeName:m[4].trim(),location:m[5].trim(),condition:m[6].trim(),script,json:jsonMatch?jsonMatch[1].trim():script});
  }
  return out;
}

async function load(){
  $('#loading').classList.remove('hidden'); $('#error').classList.add('hidden'); $('#content').classList.add('hidden');
  try{const r=await fetch(RAW_URL,{cache:'no-store'}); if(!r.ok)throw new Error(`GitHub returned ${r.status}`); pages=parseMaster(await r.text()); if(!pages.length)throw new Error('No schema sections were detected.'); filtered=[...pages]; renderNav(); selectByIndex(0); $('#loading').classList.add('hidden'); $('#content').classList.remove('hidden');}
  catch(e){$('#loading').classList.add('hidden');$('#error').classList.remove('hidden');$('#errorText').textContent=e.message+' If opening locally is blocked by your browser, serve this folder from any web host or local HTTP server.';}
}
function renderNav(){
  const nav=$('#nav');nav.innerHTML=''; $('#count').textContent=`${filtered.length} of ${pages.length} pages`;
  filtered.forEach(p=>{const b=document.createElement('button');b.dataset.number=p.number;b.innerHTML=`<span class="num">${String(p.number).padStart(2,'0')}</span><span>${escapeHtml(p.title)}</span>`;b.onclick=()=>selectPage(p.number);nav.appendChild(b)});
}
function selectPage(number){const idx=pages.findIndex(p=>p.number==number);if(idx>=0)selectByIndex(idx)}
function selectByIndex(idx){current=idx;const p=pages[idx]; if(!p)return; $('#title').textContent=p.title;$('#crumbTitle').textContent=p.title;$('#pageNumber').textContent=`Page ${String(p.number).padStart(2,'0')}`;$('#pageUrl').textContent=p.url;$('#pageUrl').href=p.url;$('#codeName').textContent=p.codeName;$('#location').textContent=p.location;$('#condition').textContent=p.condition;$('#schemaCode').textContent=p.script;$('#pagerLabel').textContent=`${idx+1} / ${pages.length}`;$('#prevBtn').disabled=idx===0;$('#nextBtn').disabled=idx===pages.length-1;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.number==p.number));history.replaceState(null,'',`#page-${p.number}`);document.title=`${p.title} — Adatasol Schema`;if(innerWidth<=850)closeMenu();}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function copy(text,label='Copied to clipboard'){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}const toast=$('#toast');toast.textContent=label;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
function cur(){return pages[current]}
$('#copyScript').onclick=$('#copyScriptTop').onclick=()=>copy(cur().script,'Full schema script copied');$('#copyJson').onclick=()=>copy(cur().json,'JSON-LD copied');document.querySelectorAll('.mini-copy').forEach(b=>b.onclick=()=>copy($('#'+b.dataset.copyTarget).textContent));$('#prevBtn').onclick=()=>selectByIndex(current-1);$('#nextBtn').onclick=()=>selectByIndex(current+1);$('#retryBtn').onclick=load;
$('#search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();filtered=pages.filter(p=>!q||`${p.number} ${p.title} ${p.url} ${p.codeName}`.toLowerCase().includes(q));renderNav()});
function openMenu(){$('.sidebar').classList.add('open');$('#overlay').classList.add('show')}function closeMenu(){$('.sidebar').classList.remove('open');$('#overlay').classList.remove('show')}$('#menuBtn').onclick=openMenu;$('#overlay').onclick=closeMenu;
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('#search').focus()}if(e.altKey&&e.key==='ArrowLeft'&&current>0)selectByIndex(current-1);if(e.altKey&&e.key==='ArrowRight'&&current<pages.length-1)selectByIndex(current+1)});
load().then(()=>{const m=location.hash.match(/page-(\d+)/);if(m)selectPage(m[1])});

</script>
</body>
</html>
